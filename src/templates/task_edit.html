{% extends "base.html" %}

{% block content %}
<nav aria-label="breadcrumb" class="mt-2">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/courses" class="text-decoration-none">Мои курсы</a></li>
    <li class="breadcrumb-item"><a href="/courses/{{ task.course.id }}" class="text-decoration-none">{{ task.course.title }}</a></li>
    <li class="breadcrumb-item active">Редактирование</li>
  </ol>
</nav>

<h2 class="fw-bold mb-4">Редактировать задание</h2>

{% if error %}
<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
{% endif %}

<div class="card bg-white col-md-8 mx-auto">
    <div class="card-body p-4">
        <form method="post" action="/tasks/{{ task.id }}/edit">
            <div class="mb-3">
                <label class="form-label fw-bold">Название задания</label>
                <input type="text" class="form-control form-control-lg" name="title" value="{{ task.title }}" required maxlength="200">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Дедлайн</label>
                <input type="datetime-local" class="form-control" name="deadline"
                       value="{{ task.deadline.strftime('%Y-%m-%dT%H:%M') if task.deadline else '' }}">
            </div>
            <div class="d-flex justify-content-between">
                <a href="/courses/{{ task.course.id }}" class="btn btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary px-4">Сохранить <i class="bi bi-check-lg ms-1"></i></button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
